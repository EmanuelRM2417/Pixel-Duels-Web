<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Duelo Pixel</title>
<style>
:root{--bg:#0c1220;--panel:#151f31;--panel2:#1c2a40;--line:#2b3c54;--mint:#78f0ce;--gold:#ffd477;--text:#f3f6fc;--muted:#a7b5c9;--red:#ff7887;--blue:#7ec7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17283b,#0c1220 65%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:750;transition:transform .08s,filter .15s}button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;gap:11px;align-items:center}.logo{width:45px;height:45px;display:grid;place-items:center;background:var(--mint);color:#10232b;border-radius:12px;font-size:25px;box-shadow:4px 4px 0 #386d68}.brand h1{font-size:21px;letter-spacing:.5px;margin:0}.sub{font-size:12px;color:var(--muted)}.coins{background:#273348;border:1px solid #41506a;border-radius:99px;padding:8px 12px;color:var(--gold);font-weight:800;white-space:nowrap}.panel{background:linear-gradient(160deg,#19263a,#121c2c);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px #0002}.hero{padding:22px;background:linear-gradient(130deg,#1e3b4a,#172338 70%);position:relative;overflow:hidden}.hero:after{content:'✦';position:absolute;right:18px;top:-18px;font-size:130px;color:#78f0ce14}.hero h2{margin:0 0 8px;font-size:26px}.hero p{color:var(--muted);max-width:560px;line-height:1.5;margin:0 0 18px}.primary{background:var(--mint);color:#10242b}.secondary{background:#293950;color:var(--text);border:1px solid #41536b}.gold{background:var(--gold);color:#35260b}.danger{background:#532a3a;color:#ffe7eb;border:1px solid #804151}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.section-title{font-size:16px;margin:0 0 12px}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.creature{border:1px solid var(--line);background:#111b2a;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}.creature.selected{border-color:var(--mint);box-shadow:inset 0 0 0 1px var(--mint);background:#183038}.sprite{width:54px;height:54px;flex-shrink:0;border-radius:12px;background:linear-gradient(145deg,#344c61,#1b293d);display:grid;place-items:center;font-size:29px;border:1px solid #496079}.creature h3{font-size:14px;margin:0 0 4px}.types{font-size:11px;color:var(--mint);font-weight:800}.stats{font-size:11px;color:var(--muted);margin-top:5px}.check{accent-color:#78f0ce;width:18px;height:18px}.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fighter{padding:14px;background:#101a29;border:1px solid var(--line);border-radius:15px;min-width:0}.fighter.enemy{background:#251b2c}.fighter-name{display:flex;justify-content:space-between;gap:8px;align-items:start}.fighter h3{margin:0 0 5px;font-size:16px}.level{font-size:10px;color:var(--muted)}.big-sprite{font-size:52px;text-align:center;padding:7px 0 3px;filter:drop-shadow(0 5px 0 #0003)}.hpbar{height:9px;background:#303d50;border-radius:99px;overflow:hidden;margin:9px 0 5px}.hpfill{height:100%;background:linear-gradient(90deg,#55d6a0,#a4f0ad);transition:width .25s}.enemy .hpfill{background:linear-gradient(90deg,#ff647e,#ffad83)}.hptext{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.battle-info{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:10px}.moves{display:grid;grid-template-columns:1fr 1fr;gap:9px}.move{background:#25364b;color:white;border:1px solid #405772;text-align:left;padding:12px;min-height:72px}.move strong{display:block;font-size:14px;margin-bottom:5px}.move span{font-size:11px;color:#c4d3e5}.move .pow{float:right;color:var(--gold)}.log{height:132px;overflow:auto;background:#0b1320;border:1px solid #27384e;border-radius:12px;padding:10px;font-size:12px;color:#cfdae9;line-height:1.55}.log p{margin:0 0 4px}.log p:first-child{color:var(--mint)}.result{text-align:center;padding:12px;border-radius:12px;margin-bottom:12px;background:#24374a;color:var(--gold);font-weight:900;font-size:20px}.hidden{display:none!important}.footer{text-align:center;color:#71829a;font-size:11px;padding:12px}.tiny{font-size:12px;color:var(--muted);line-height:1.5}.pill{display:inline-block;background:#263a4e;border:1px solid #3c5269;padding:4px 8px;border-radius:99px;font-size:11px;color:#d8e7f6;margin:2px}.progress{height:5px;background:#2b3c54;border-radius:10px;margin-top:6px;overflow:hidden}.progress div{height:100%;background:var(--mint)}@media(max-width:520px){.wrap{padding:11px}.panel{padding:13px}.brand h1{font-size:18px}.hero h2{font-size:23px}.roster{grid-template-columns:1fr}.sprite{width:49px;height:49px}.battle-top{gap:8px}.fighter{padding:10px}.big-sprite{font-size:43px}.fighter h3{font-size:14px}.moves{gap:7px}.move{padding:10px;min-height:72px}.move strong{font-size:12px}.move span{font-size:10px}.coins{font-size:12px;padding:7px 10px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand"><div class="logo">⚔</div><div><h1>DUELO PIXEL</h1><div class="sub">Colecciona · Combate · Aprende</div></div></div><div class="coins">◈ <span id="coins">60</span></div></header>
<main id="app"></main><div class="footer">Prototipo web · Guarda las monedas en este navegador</div></div>
<script>
const ENTITIES = [{"id":"emberfox","name":"Brasafox","types":["Fuego"],"stats":{"HP":95,"Attack":115,"Defense":75,"SpA":105,"SpD":80,"Speed":120},"ability":"Impulso Ígneo","moves":[{"name":"Mordida Ardiente","type":"Fuego","category":"Physical","power":55,"accuracy":95,"crit_chance":0.0625},{"name":"Chispa Solar","type":"Fuego","category":"Special","power":70,"accuracy":90,"crit_chance":0.0625},{"name":"Rasguño","type":"Guerra","category":"Physical","power":40,"accuracy":100},{"name":"Concentración","type":"Mente","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"SpA","amount":2}}]},{"id":"tidehorn","name":"Mareacerno","types":["Agua"],"stats":{"HP":125,"Attack":90,"Defense":115,"SpA":95,"SpD":110,"Speed":55},"ability":"Coraza Marina","moves":[{"name":"Chorro de Marea","type":"Agua","category":"Special","power":65,"accuracy":100},{"name":"Golpe de Concha","type":"Agua","category":"Physical","power":60,"accuracy":95},{"name":"Placaje","type":"Guerra","category":"Physical","power":40,"accuracy":100},{"name":"Reposo Breve","type":"Agua","category":"Status","accuracy":100,"effect":{"kind":"heal","percent":0.25}}]},{"id":"voltkit","name":"Voltín","types":["Rayo"],"stats":{"HP":80,"Attack":90,"Defense":70,"SpA":120,"SpD":75,"Speed":135},"ability":"Carga Viva","moves":[{"name":"Descarga","type":"Rayo","category":"Special","power":70,"accuracy":95},{"name":"Zarpazo Eléctrico","type":"Rayo","category":"Physical","power":55,"accuracy":100},{"name":"Pulso Mental","type":"Mente","category":"Special","power":50,"accuracy":100},{"name":"Aceleración","type":"Rayo","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Speed","amount":2}}]},{"id":"mossback","name":"Musgón","types":["Planta","Roca"],"stats":{"HP":115,"Attack":95,"Defense":125,"SpA":75,"SpD":100,"Speed":45},"ability":"Raíces Firmes","moves":[{"name":"Látigo de Hiedra","type":"Planta","category":"Physical","power":65,"accuracy":95},{"name":"Lluvia de Polen","type":"Planta","category":"Special","power":55,"accuracy":100},{"name":"Pedrada","type":"Roca","category":"Physical","power":60,"accuracy":90},{"name":"Fortalecer","type":"Roca","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Defense","amount":2}}]},{"id":"shadeowl","name":"Umbrúho","types":["Oscuridad","Aire"],"stats":{"HP":90,"Attack":105,"Defense":80,"SpA":95,"SpD":95,"Speed":115},"ability":"Acecho","moves":[{"name":"Ala Sombría","type":"Oscuridad","category":"Physical","power":60,"accuracy":95},{"name":"Viento Cortante","type":"Aire","category":"Special","power":55,"accuracy":100},{"name":"Picotazo","type":"Bicho","category":"Physical","power":45,"accuracy":100},{"name":"Mirada Fija","type":"Mente","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"enemy","stat":"Attack","amount":-1}}]},{"id":"ironbud","name":"Ferrabrote","types":["Metal","Planta"],"stats":{"HP":105,"Attack":90,"Defense":130,"SpA":80,"SpD":115,"Speed":50},"ability":"Blindaje Natural","moves":[{"name":"Embate Metálico","type":"Metal","category":"Physical","power":65,"accuracy":95},{"name":"Semilla Dura","type":"Planta","category":"Physical","power":55,"accuracy":100},{"name":"Pulso Mineral","type":"Roca","category":"Special","power":50,"accuracy":100},{"name":"Cubrirse","type":"Metal","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Defense","amount":1}}]},{"id":"mindlynx","name":"Mentialince","types":["Mente"],"stats":{"HP":85,"Attack":80,"Defense":75,"SpA":130,"SpD":105,"Speed":105},"ability":"Enfoque","moves":[{"name":"Onda Psíquica","type":"Mente","category":"Special","power":70,"accuracy":95},{"name":"Golpe Mental","type":"Mente","category":"Physical","power":45,"accuracy":100},{"name":"Destello","type":"Luz","category":"Special","power":50,"accuracy":100},{"name":"Calma","type":"Mente","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"SpA","amount":1}}]},{"id":"stonejaw","name":"Rocamandíbula","types":["Roca","Tierra"],"stats":{"HP":130,"Attack":120,"Defense":120,"SpA":55,"SpD":80,"Speed":35},"ability":"Peso Pesado","moves":[{"name":"Mordisco Rocoso","type":"Roca","category":"Physical","power":70,"accuracy":90},{"name":"Temblor","type":"Tierra","category":"Physical","power":65,"accuracy":95},{"name":"Cabeza Dura","type":"Guerra","category":"Physical","power":50,"accuracy":100},{"name":"Aguantar","type":"Tierra","category":"Status","accuracy":100,"effect":{"kind":"heal","percent":0.15}}]},{"id":"glimmerfin","name":"Lumineta","types":["Agua","Luz"],"stats":{"HP":95,"Attack":70,"Defense":85,"SpA":115,"SpD":115,"Speed":100},"ability":"Brillo Sereno","moves":[{"name":"Rayo de Aurora","type":"Luz","category":"Special","power":65,"accuracy":100},{"name":"Burbuja Prismática","type":"Agua","category":"Special","power":55,"accuracy":100},{"name":"Aleteo","type":"Aire","category":"Physical","power":45,"accuracy":100},{"name":"Regeneración","type":"Luz","category":"Status","accuracy":100,"effect":{"kind":"heal","percent":0.2}}]},{"id":"ghosthare","name":"Nebliebre","types":["Espectro"],"stats":{"HP":85,"Attack":100,"Defense":75,"SpA":110,"SpD":90,"Speed":125},"ability":"Paso Etéreo","moves":[{"name":"Eco Fantasma","type":"Espectro","category":"Special","power":65,"accuracy":95},{"name":"Zarpazo Umbrío","type":"Oscuridad","category":"Physical","power":60,"accuracy":95},{"name":"Embate","type":"Guerra","category":"Physical","power":45,"accuracy":100},{"name":"Velo Tenue","type":"Espectro","category":"Status","accuracy":100,"effect":{"kind":"stage","target":"self","stat":"Evasion","amount":1}}]}];
const icons={'Fuego':'🔥','Agua':'🌊','Rayo':'⚡','Planta':'🌿','Roca':'🪨','Tierra':'🌎','Aire':'🌪️','Metal':'⚙️','Dragón':'🐉','Mente':'🔮','Oscuridad':'🌑','Luz':'✨','Espectro':'👻','Bicho':'🪲','Guerra':'⚔️','Encanto':'💫','Divino':'☀️','Vacío':'🌌','Sigilo':'🗡️','Héroe':'🛡️'};
const state={coins:Number(localStorage.getItem('dp-coins')||60),team:[],battle:null};
const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function icon(e){return e.types.map(t=>icons[t]||'✦')[0]||'✦'}function saveCoins(){localStorage.setItem('dp-coins',state.coins);$('coins').textContent=state.coins}
function card(e,i,checked=false){return `<label class="creature ${checked?'selected':''}"><input class="check teamcheck" type="checkbox" value="${i}" ${checked?'checked':''}><div class="sprite">${icon(e)}</div><div style="min-width:0;flex:1"><h3>${esc(e.name)}</h3><div class="types">${e.types.map(esc).join(' · ')}</div><div class="stats">PS ${e.stats.HP} · ATQ ${e.stats.Attack} · VEL ${e.stats.Speed}</div></div></label>`}
function menu(){state.battle=null;$('app').innerHTML=`<section class="panel hero"><h2>Tu próximo duelo empieza aquí.</h2><p>Forma tu equipo, elige movimientos y enfréntate a un rival controlado por la IA. Cada criatura tiene tipos, estadísticas y técnicas diferentes.</p><div class="row"><button class="primary" id="start">Elegir equipo</button><button class="secondary" id="quick">Combate rápido</button></div></section><section class="panel"><h2 class="section-title">Tu colección · ${ENTITIES.length} criaturas disponibles</h2><div class="roster">${ENTITIES.map(e=>`<div class="creature"><div class="sprite">${icon(e)}</div><div style="min-width:0"><h3>${esc(e.name)}</h3><div class="types">${e.types.map(esc).join(' · ')}</div><div class="stats">${e.ability?esc(e.ability):''}</div></div></div>`).join('')}</div></section>`;$('start').onclick=teamScreen;$('quick').onclick=()=>{state.team=shuffle(ENTITIES).slice(0,8).map(fresh);beginBattle()}}
function teamScreen(){let picks=state.team.map(f=>ENTITIES.findIndex(e=>e.id===f.data.id));$('app').innerHTML=`<section class="panel"><h2 class="section-title">Elige tu equipo</h2><p class="tiny">Selecciona 8 criaturas. Puedes elegir de nuevo cuando quieras.</p><div class="battle-info"><span id="count">0 de 8 seleccionadas</span><span>Equipo completo para combatir</span></div><div class="roster" id="picklist">${ENTITIES.map((e,i)=>card(e,i,picks.includes(i))).join('')}</div><p class="tiny" id="pickerror"></p><div class="row" style="margin-top:14px"><button class="secondary" id="back">Volver</button><button class="primary" id="fight">Empezar combate</button></div></section>`;let update=()=>{let checks=[...document.querySelectorAll('.teamcheck')];let vals=checks.filter(c=>c.checked);$('count').textContent=`${vals.length} de 8 seleccionadas`;checks.forEach(c=>c.closest('.creature').classList.toggle('selected',c.checked));$('fight').disabled=vals.length!==8};document.querySelectorAll('.teamcheck').forEach(c=>c.onchange=update);$('back').onclick=menu;$('fight').onclick=()=>{state.team=[...document.querySelectorAll('.teamcheck:checked')].map(c=>fresh(ENTITIES[Number(c.value)]));beginBattle()};update()}
function fresh(e){return {data:e,hp:e.stats.HP,max:e.stats.HP,stages:{Attack:0,Defense:0,SpA:0,SpD:0,Speed:0,Accuracy:0,Evasion:0},status:null,get alive(){return this.hp>0},stat(s){return Math.max(1,Math.round(this.data.stats[s]*(1+.05*(this.stages[s]||0))))}}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function beginBattle(){let enemies=shuffle(ENTITIES).slice(0,8).map(fresh);state.battle={p:state.team,e:enemies,pi:0,ei:0,turn:1,log:['¡Comienza el combate!','Elige uno de tus cuatro movimientos.'],result:null,reward:0};renderBattle()}
function active(side){let b=state.battle;return b[side==='p'?'p':'e'][b[side==='p'?'pi':'ei']]}function living(side){return state.battle[side].map((f,i)=>f.hp>0?i:-1).filter(i=>i>=0)}
const strong={'Fuego':['Planta','Bicho','Metal'],'Agua':['Fuego','Tierra','Roca'],'Rayo':['Agua','Aire'],'Planta':['Agua','Tierra','Roca'],'Tierra':['Rayo','Fuego','Metal'],'Roca':['Aire','Fuego','Bicho'],'Aire':['Planta','Bicho'],'Metal':['Roca','Encanto'],'Dragón':['Dragón'],'Mente':['Guerra'],'Oscuridad':['Mente','Luz'],'Luz':['Oscuridad','Espectro']};const weak={'Fuego':['Agua','Roca','Dragón'],'Agua':['Planta','Dragón'],'Rayo':['Planta','Tierra','Dragón'],'Planta':['Fuego','Bicho','Aire','Dragón','Metal'],'Tierra':['Planta','Bicho','Aire'],'Roca':['Agua','Planta','Metal','Tierra'],'Aire':['Rayo','Roca','Metal'],'Metal':['Fuego','Agua','Rayo'],'Dragón':['Metal'],'Mente':['Oscuridad','Metal'],'Oscuridad':['Guerra','Encanto'],'Luz':['Metal','Divino']};function typeMod(t,d){let m=0;d.data.types.forEach(x=>{if((strong[t]||[]).includes(x))m+=20;if((weak[t]||[]).includes(x))m-=20});return m}
function log(msg){let b=state.battle;b.log.push(msg);b.log=b.log.slice(-24)}function useMove(a,d,m){let chance=m.accuracy??100, delta=(a.stages.Accuracy||0)-(d.stages.Evasion||0);chance*=delta>=0?1.1**delta:.9**(-delta);chance=Math.max(0,Math.min(100,chance));if(Math.random()*100>=chance){log(`${a.data.name} falla ${m.name}.`);return}if(m.category==='Status'){let ef=m.effect||{};if(ef.kind==='stage'){let target=(ef.target||'self')==='self'?a:d;let stat=ef.stat||'Attack';target.stages[stat]=Math.max(-10,Math.min(10,(target.stages[stat]||0)+(ef.amount||1)));log(`${target.data.name}: ${stat} ${ef.amount>0?'+':''}${ef.amount||1}.`)}else if(ef.kind==='heal'){let amount=Math.round(a.max*(ef.percent||.25));let heal=Math.min(amount,a.max-a.hp);a.hp+=heal;log(`${a.data.name} recupera ${heal} PS.`)}else if(ef.kind==='status'){if(!d.status){d.status=ef.status||'Estado';log(`${d.data.name} recibe ${d.status}.`)}else log(`${d.data.name} ya tiene un estado.`)}else log(`${a.data.name} usa ${m.name}.`);return}let atk=m.category==='Physical'?'Attack':'SpA',def=m.category==='Physical'?'Defense':'SpD';let base=(m.power||40)*a.stat(atk)/(a.stat(atk)+d.stat(def));let mod=typeMod(m.type,d);if(a.data.types.includes(m.type))mod+=20;let crit=Math.random()<(m.crit_chance??.0625);if(crit)mod+=50;let damage=Math.max(1,Math.round(base*(1+mod/100)));d.hp=Math.max(0,d.hp-damage);log(`${a.data.name} usa ${m.name}: ${damage} de daño${crit?' ¡CRÍTICO!':''}.`);if(mod>=20)log('¡Es muy eficaz!');if(mod<=-20)log('No fue muy eficaz.');if(!d.alive)log(`¡${d.data.name} queda fuera de combate!`)}
function endCheck(){let b=state.battle,pl=living('p'),el=living('e');if(!pl.length&&!el.length){b.result='Empate';b.reward=3;log('Empate. +3 monedas.')}else if(!pl.length){b.result='Derrota';b.reward=5;log('Equipo derrotado. +5 monedas.')}else if(!el.length){b.result='Victoria';b.reward=12;log('¡Victoria! +12 monedas.')}else{if(!active('p').alive){b.pi=pl[0];log(`${active('p').data.name} entra al combate.`)}if(!active('e').alive){b.ei=el[0];log(`${active('e').data.name} entra al combate.`)}}}
function act(mi){let b=state.battle;if(b.result)return;let p=active('p'),e=active('e'),pm=p.data.moves[mi],em=e.data.moves[Math.floor(Math.random()*e.data.moves.length)];if(p.stat('Speed')>=e.stat('Speed')){useMove(p,e,pm);if(e.alive)useMove(e,p,em)}else{useMove(e,p,em);if(p.alive)useMove(p,e,pm)}endCheck();if(!b.result){b.turn++;log(`Turno ${b.turn}.`)}renderBattle()}
function renderBattle(){let b=state.battle,p=active('p'),e=active('e');let fighter=(f,side)=>`<div class="fighter ${side==='e'?'enemy':''}"><div class="fighter-name"><div><h3>${esc(f.data.name)}</h3><div class="types">${f.data.types.map(esc).join(' · ')}</div></div><span class="level">${side==='p'?'TUYO':'RIVAL'}</span></div><div class="big-sprite">${icon(f.data)}</div><div class="hpbar"><div class="hpfill" style="width:${Math.max(0,f.hp/f.max*100)}%"></div></div><div class="hptext"><span>PS ${f.hp}/${f.max}</span><span>${f.status?esc(f.status):'—'}</span></div><div class="progress"><div style="width:${Math.max(0,f.hp/f.max*100)}%"></div></div></div>`;
$('app').innerHTML=`<section class="panel"><div class="battle-info"><span>COMBATE · TURNO ${b.turn}</span><span>Equipo ${living('p').length}/8 · Rival ${living('e').length}/8</span></div><div class="battle-top">${fighter(e,'e')}${fighter(p,'p')}</div></section>${b.result?`<section class="result">${b.result} · +${b.reward} monedas</section>`:''}<section class="panel"><h2 class="section-title">Movimientos de ${esc(p.data.name)}</h2><div class="moves">${p.data.moves.map((m,i)=>`<button class="move" data-move="${i}" ${b.result?'disabled':''}><strong>${esc(m.name)} <span class="pow">${m.power?m.power+' P':'EST'}</span></strong><span>${esc(m.type)} · ${m.category==='Status'?'Estado':m.category==='Physical'?'Físico':'Especial'} · Precisión ${m.accuracy??100}%</span></button>`).join('')}</div></section><section class="panel"><h2 class="section-title">Registro del combate</h2><div class="log" id="log">${b.log.map(x=>`<p>› ${esc(x)}</p>`).join('')}</div></section><section class="panel"><div class="row"><button class="secondary" id="teamview">Ver equipo</button><button class="primary" id="again">${b.result?'Nuevo combate':'Abandonar combate'}</button></div></section>`;document.querySelectorAll('[data-move]').forEach(btn=>btn.onclick=()=>act(Number(btn.dataset.move)));$('again').onclick=()=>{if(!b.result){state.coins+=0;saveCoins()}menu()};$('teamview').onclick=teamSummary;let logel=$('log');logel.scrollTop=logel.scrollHeight;if(b.result&&b.reward){state.coins+=b.reward;b.reward=0;saveCoins();}}
function teamSummary(){let b=state.battle;$('app').innerHTML=`<section class="panel"><h2 class="section-title">Tu equipo</h2><div class="roster">${b.p.map(f=>`<div class="creature"><div class="sprite">${icon(f.data)}</div><div><h3>${esc(f.data.name)}</h3><div class="types">${f.data.types.join(' · ')}</div><div class="stats">PS ${f.hp}/${f.max}</div></div></div>`).join('')}</div><button class="primary" style="width:100%;margin-top:14px" id="return">Volver al combate</button></section>`;$('return').onclick=renderBattle}
menu();saveCoins();
</script></body></html>
